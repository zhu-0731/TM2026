# Prometheus queries for Online Boutique (Istio + cAdvisor + kube-state-metrics)
# Prometheus: istio-system/prometheus (port-forward → localhost:9090)
#
# Coverage: 63 features (10 services × 6 metrics + redis-cart × 3 metrics)
#   - qps/latency_p95/error_rate → Istio Envoy metrics (istio_requests_total)
#   - cpu_usage → cAdvisor (container_cpu_usage_seconds_total, cpu="total")
#   - memory_usage → cAdvisor (container_memory_working_set_bytes / MiB)
#   - restart_count → kube-state-metrics (kube_pod_container_status_restarts_total)
# redis-cart: only cpu_usage/memory_usage/restart_count (TCP protocol, no HTTP metrics)

queries:
  # ---- frontend ----
  frontend_qps: 'sum(irate(istio_requests_total{destination_service_name="frontend",destination_service_namespace="online-boutique"}[1m]))'
  frontend_latency_p95: 'histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{destination_service_name="frontend",destination_service_namespace="online-boutique"}[1m])) by (le))'
  frontend_error_rate: '(sum(rate(istio_requests_total{destination_service_name="frontend",destination_service_namespace="online-boutique",response_code=~"5.."}[1m])) or vector(0)) / sum(rate(istio_requests_total{destination_service_name="frontend",destination_service_namespace="online-boutique"}[1m]))'
  frontend_cpu_usage: 'sum(rate(container_cpu_usage_seconds_total{namespace="online-boutique",pod=~"frontend-.*",cpu="total"}[1m]))'
  frontend_memory_usage: 'sum(container_memory_working_set_bytes{namespace="online-boutique",pod=~"frontend-.*"}) / 1048576'
  frontend_restart_count: 'sum(kube_pod_container_status_restarts_total{namespace="online-boutique",pod=~"frontend-.*"})'

