apiVersion: apps/v1
kind: Deployment
metadata:
  name: couponservice
  labels:
    app: couponservice
spec:
  selector:
    matchLabels:
      app: couponservice
  template:
    metadata:
      labels:
        app: couponservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: couponservice:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: couponservice
  labels:
    app: couponservice
spec:
  type: ClusterIP
  selector:
    app: couponservice
  ports:
  - name: http
    port: 8080
    targetPort: 8080